  <!-- الستايل: المشترك أول، وبعده ملف الصفحة -->

  <!-- ===== المحتوى ===== -->
  <main>
    <section class="page">
      <div class="container tasks-wrap">

        <header class="page-header">
          <h1><i class="fa-solid fa-calendar-check"></i> المهام الدراسية</h1>
          <p>أضف مهامك وتابع إنجازها</p>
        </header>

        <!-- إضافة مهمة: الحقل أول (يمين) والزر ثاني (يسار) -->
        <form class="task-form" id="taskForm">
          <input type="text" id="taskInput" placeholder="أدخل مهمة جديدة..." maxlength="100" aria-label="المهمة الجديدة" autocomplete="off">
          <button type="submit" class="btn btn-primary">إضافة</button>
        </form>

        <!-- أزرار الفلترة -->
        <div class="filters">
          <button type="button" class="filter-btn active" data-filter="all">الكل</button>
          <button type="button" class="filter-btn" data-filter="pending">غير مكتملة</button>
          <button type="button" class="filter-btn" data-filter="done">مكتملة</button>
        </div>

        <!-- قائمة المهام (بتنبني بالجافاسكربت) -->
        <div class="task-card">
          <ul class="task-list" id="taskList"></ul>
          <p class="task-empty" id="taskEmpty" hidden></p>
        </div>


      </div>
    </section>
  </main>
